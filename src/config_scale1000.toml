# CORA — Apertus classifier for the Swiss Federal Archives.
# Every value can be overridden by the environment variables LLM_NAME, LLM_BASE_URL, LLM_API_KEY.

[llm]
model = "apertus-v1-5-8b"                      # scale run: 8B for speed
compare_model = "apertus-v1-5-8b"              # second opinion used by the quality check
base_url = "https://gateway.keera.ch/api/v1"   # Keera Gateway -> CSCS inference (OpenAI-compatible)
temperature = 0.1
max_tokens = 2500
workers = 12
retries = 3

[sample]
size = 1000
seed = 1000
# "stratified" draws from three strata so the demo shows every kind of record;
# Strata use only the original "form" field. "uniform" draws uniformly over all 263k item-level records (mostly TV news clips).
strategy = "stratified"
strata = { audiovisual = 400, still_image = 300, other = 300 }

[classify]
resume = true            # 3-sentence résumé on/off
output_language = "en"   # language of résumé and normalised fields
preprocessing = true     # preprocessing-needs assessment on/off
story_map = true         # provenance trail ("retracé") on/off

[enrich]
geocoder = "nominatim"             # public bulk-friendly, cached, 1 req/s
geocoder_url = "https://nominatim.openstreetmap.org/search"
wikidata = true                    # entity linking against Wikidata
user_agent = "CORA-Apertus/0.1 (Hack Apertus 2026 demo; contact: hello@hackapertus.ch)"

[paths]
data_dir = "../data/scale1000"
site_dir = "site"
